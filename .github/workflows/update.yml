name: WhiteFast Pool Update

on:
  schedule:
    # Запуск каждый час в 17 минут (UTC).
    - cron: "17 * * * *"
  workflow_dispatch:   # ручной запуск из вкладки Actions

# Даем боту права на запись, чтобы он мог делать git push в папку subs/
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Download sing-box
        run: |
          mkdir -p bin
          LATEST_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux-amd64.tar.gz$")) | .browser_download_url')
          echo "Downloading: $LATEST_URL"
          curl -L -o /tmp/sing-box.tar.gz "$LATEST_URL"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          cp /tmp/sing-box-*/sing-box bin/sing-box
          chmod +x bin/sing-box

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: out/cache.json
          key: whitefast-cache-${{ github.run_id }}
          restore-keys: whitefast-cache-

      - name: Run pipeline
        run: python run_once.py

      - name: Save and commit subscriptions
        run: |
          # Создаем папку subs, если её нет
          mkdir -p subs
          
          # Копируем все сгенерированные JSON-файлы туда
          cp out/WhiteFast-*.json subs/ || true
          
          # Настраиваем Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Коммитим изменения
          git add subs/
          git commit -m "Auto-update subscriptions" || echo "No changes to commit"
          
          # Пушим в репозиторий
          git push
